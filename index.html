<!doctype html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>PrivaSearch</title>
	<link rel="stylesheet" href="/src/style.css" />
</head>

<body>
	<div class="app">
		<div class="orb orb_one"></div>
		<div class="orb orb_two"></div>

		<aside class="sidebar pane">
			<header class="sidebar_head">
				<h1 class="app_title">PrivaSearch</h1>
				<nav class="page_switch" id="page_switch" aria-label="视图切换"></nav>
			</header>

			<section class="page_view" id="page_docs" data-page="docs">
				<div class="import_block">
					<div id="drop_zone" class="dropzone card">
						<input type="file" id="file_input" class="visually_hidden" multiple
							accept=".txt,.md,.json,.csv,.js,.py" />
						<span class="dropzone_icon" aria-hidden="true"><i data-lucide="upload-cloud"></i></span>
						<p class="dropzone_title">拖拽文件到此处 或 点击上传</p>
						<p class="dropzone_hint">支持 TXT, MD, JSON, Code 等</p>
					</div>

					<button id="btn_load_sample" class="load_sample card" type="button">
						<i data-lucide="sparkles" aria-hidden="true"></i>
						<span>加载默认演示文档库</span>
					</button>
				</div>

				<div class="shelf_head">
					<span class="shelf_label">文档库 <span class="shelf_count" id="doc_count">0</span></span>
					<button id="btn_clear_docs" class="shelf_clear" type="button">清空</button>
				</div>

				<div id="doc_list" class="doc_shelf" role="list"></div>
			</section>

			<section class="page_view" id="page_queue" data-page="queue" hidden>
				<div id="queue_shelf" class="doc_shelf"></div>
			</section>

			<footer class="runtime card">
				<p class="runtime_model" id="rt_model">—</p>
				<div class="runtime_meta">
					<span class="runtime_source" id="rt_source">—</span>
					<span class="runtime_sep" aria-hidden="true"></span>
					<span class="runtime_dim" id="rt_dim">—</span>
				</div>
				<div class="runtime_badges">
					<span class="runtime_badge backend_badge" id="rt_backend_badge">
						<span class="runtime_badge_label">推理</span>
						<b class="runtime_badge_val" id="rt_backend">—</b>
					</span>
					<span class="runtime_badge">
						<span class="runtime_badge_label">量化</span>
						<b class="runtime_badge_val" id="rt_quant">—</b>
					</span>
				</div>
			</footer>
		</aside>

		<main class="workspace pane">
			<header class="status card">
				<span class="status_label">端侧计算状态</span>
				<span id="stat_chunks" class="chip">切分切片: 0</span>
				<span id="stat_latency" class="chip">匹配响应: 0 ms</span>
			</header>

			<section class="results" aria-label="Search results">
				<div class="results_inner">
					<div id="results_list" class="results_list" aria-live="polite">
						<div id="initial_state" class="empty">
							<span class="empty_icon card" aria-hidden="true"><i data-lucide="search-code"></i></span>
							<p class="empty_title">探索您的私密知识库</p>
							<p class="empty_hint">在下方输入框中用自然语言提问，即刻检索调取最相关的带出处的证据片段</p>
						</div>
					</div>
				</div>
			</section>

			<footer class="searchdock">
				<div class="searchbar">
					<i data-lucide="search" class="searchbar_icon" aria-hidden="true"></i>
					<input id="search_input" type="text" autocomplete="off"
						placeholder="搜索知识库文档，例如：‘数据安全规范’、‘RAG 架构’ 或 ‘模型部署’..." />
					<button id="btn_search" class="searchbtn" type="button">
						<span>检索</span>
						<i data-lucide="arrow-right" aria-hidden="true"></i>
					</button>
				</div>

				<div class="dock_options">
					<div class="field">
						<span class="field_label">检索方式</span>
						<div id="search_mode_dd" class="dd_host"></div>
					</div>

					<div class="field">
						<label for="top_k">Top-K 结果</label>
						<div class="stepper">
							<button id="top_k_dec" class="step_btn" type="button" aria-label="减少 Top-K 值">−</button>
							<input id="top_k" class="select select_numeric" type="number" inputmode="numeric" min="1" max="20" />
							<button id="top_k_inc" class="step_btn" type="button" aria-label="增加 Top-K 值">+</button>
						</div>
					</div>
				</div>
			</footer>
		</main>
	</div>

	<script type="module" src="/src/main.ts"></script>
</body>

</html>
